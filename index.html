<!--
  e-commerce-single-file-emailjs.html
  Un e-commerce sencillo en UN SOLO archivo HTML que envía la compra por EmailJS.

  INSTRUCCIONES RÁPIDAS:
  1) Crea cuenta en https://www.emailjs.com
  2) Añade un "Service" (ej: Gmail) y copia el SERVICE_ID
  3) Crea una plantilla (Template) y usa variables: order_details, customer_name, customer_email, total
     Copia el TEMPLATE_ID
  4) En Account → API Keys copia tu PUBLIC_KEY
  5) Reemplaza los textos: "TU_SERVICE_ID", "TU_TEMPLATE_ID", "TU_PUBLIC_KEY"
  6) Abre este archivo en el navegador (no necesita servidor). Prueba con tu correo.

  Nota: la "Public Key" es segura para el cliente. Nunca expongas tu clave privada.
-->

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini E‑commerce — Envío por EmailJS</title>
  <style>
    :root{
      --bg:#0f1724; --card:#0b1320; --accent:#7c3aed; --muted:#a3b1c6; --glass: rgba(255,255,255,0.04);
      --radius:14px; --glass-2: rgba(255,255,255,0.02);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#071022 0%, var(--bg) 100%);color:#e6eef8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .app{width:1100px;max-width:100%;display:grid;grid-template-columns:1fr 420px;gap:28px}
    .store{background:linear-gradient(180deg,var(--card), rgba(11,19,32,0.9));padding:22px;border-radius:var(--radius);box-shadow:0 6px 30px rgba(2,6,23,0.6);}
    h1{margin:0 0 6px 0;font-size:20px}
    p.lead{margin:0 0 18px 0;color:var(--muted)}

    .products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .product{background:var(--glass);padding:14px;border-radius:12px;display:flex;gap:12px;align-items:center}
    .thumb{width:86px;height:86px;border-radius:10px;background:linear-gradient(135deg,#0a2540,#1b3b6b);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:20px}
    .meta{flex:1}
    .meta h3{margin:0;font-size:15px}
    .meta p{margin:4px 0 0 0;color:var(--muted);font-size:13px}
    .price{font-weight:700}
    .actions{display:flex;flex-direction:column;gap:8px}
    button.btn{background:linear-gradient(90deg,var(--accent),#5b21b6);border:0;padding:8px 12px;border-radius:10px;color:white;cursor:pointer}
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:6px 10px;border-radius:10px;color:var(--muted);cursor:pointer}

    /* Cart */
    .cart{background:linear-gradient(180deg,rgba(255,255,255,0.02),var(--glass-2));padding:18px;border-radius:var(--radius);min-height:380px}
    .cart h2{margin:0 0 6px 0}
    .cart .items{margin-top:12px;display:flex;flex-direction:column;gap:10px}
    .item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,0.012),transparent)}
    .item small{color:var(--muted)}
    .totals{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,255,255,0.03);display:flex;justify-content:space-between;align-items:center}

    /* checkout */
    form.checkout{margin-top:12px;display:flex;flex-direction:column;gap:8px}
    input,textarea,select{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:10px;border-radius:8px;color:inherit}
    textarea{min-height:80px}
    .note{font-size:13px;color:var(--muted)}

    footer{margin-top:12px;font-size:12px;color:var(--muted);text-align:center}

    @media (max-width:980px){.app{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="app">
    <section class="store">
      <h1>Mini Tienda — Productos Destacados</h1>
      <p class="lead">Añade productos al carrito y realiza la compra. Se enviará un correo con el detalle de la orden.</p>

      <div class="products" id="products"></div>

      <footer>
        <small>Diseño moderno y responsivo · Integración EmailJS</small>
      </footer>
    </section>

    <aside class="cart">
      <h2>Carrito</h2>
      <div class="items" id="cart-items">
        <small class="note">Tu carrito está vacío.</small>
      </div>

      <div class="totals">
        <strong>Total:</strong>
        <strong id="cart-total">S/ 0.00</strong>
      </div>

      <form class="checkout" id="checkout-form">
        <label class="note">Datos para la compra</label>
        <input name="customer_name" placeholder="Tu nombre" required />
        <input name="customer_email" type="email" placeholder="Tu email" required />
        <textarea name="notes" placeholder="Notas (dirección, teléfono, referencia)"></textarea>
        <button type="submit" class="btn">Realizar pedido</button>
        <button type="button" id="clear-cart" class="ghost">Vaciar carrito</button>
      </form>

    </aside>
  </div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    // === CONFIG: reemplaza con tus datos ===
    //const EMAILJS_SERVICE_ID = 'TU_SERVICE_ID';
    const EMAILJS_SERVICE_ID = 'service_7jyinqk';
    //const EMAILJS_TEMPLATE_ID = 'TU_TEMPLATE_ID';
    const EMAILJS_TEMPLATE_ID = 'template_knkil7s';
    //const EMAILJS_PUBLIC_KEY = 'TU_PUBLIC_KEY';
    const EMAILJS_PUBLIC_KEY = 'JBfNPtlBAA85DX84X';
    // =======================================

    (function(){
      if (window.emailjs) emailjs.init(EMAILJS_PUBLIC_KEY);
      else console.warn('EmailJS SDK no cargado');
    })();

    // Productos (puedes añadir, editar, cambiar precios)
    const PRODUCTS = [
      { id: 'p1', title: 'Auriculares Wireless', price: 129.99, desc: 'Sonido claro, batería 20h' },
      { id: 'p2', title: 'Teclado Mecánico', price: 219.50, desc: 'Switches táctiles, retroiluminación' },
      { id: 'p3', title: 'Mouse Gamer', price: 89.00, desc: 'Sensor óptico 16000 DPI' },
      { id: 'p4', title: 'Mochila Urbana', price: 149.00, desc: 'Compartimento laptop 15"' }
    ];

    // Estado del carrito
    const cart = {};

    // Utils
    const toCurrency = v => 'S/ ' + v.toFixed(2);

    // Render productos
    const productsEl = document.getElementById('products');
    PRODUCTS.forEach(p => {
      const div = document.createElement('div'); div.className='product';
      div.innerHTML = `
        <div class='thumb'>${p.title.split(' ')[0].slice(0,2).toUpperCase()}</div>
        <div class='meta'>
          <h3>${p.title}</h3>
          <p>${p.desc}</p>
        </div>
        <div style='text-align:right'>
          <div class='price'>${toCurrency(p.price)}</div>
          <div class='actions'>
            <button class='btn' data-id='${p.id}'>Añadir</button>
          </div>
        </div>
      `;
      productsEl.appendChild(div);
    });

    // Añadir listener a botones de añadir
    productsEl.addEventListener('click', (e)=>{
      const btn = e.target.closest('button'); if(!btn) return;
      const id = btn.dataset.id; if(!id) return;
      addToCart(id);
    });

    // Cart UI
    const cartItemsEl = document.getElementById('cart-items');
    const cartTotalEl = document.getElementById('cart-total');

    function addToCart(id){
      if (!cart[id]) cart[id] = { ...PRODUCTS.find(p=>p.id===id), qty:0 };
      cart[id].qty++;
      renderCart();
    }

    function removeFromCart(id){
      if (!cart[id]) return;
      cart[id].qty--;
      if (cart[id].qty<=0) delete cart[id];
      renderCart();
    }

    function clearCart(){
      for(const k in cart) delete cart[k];
      renderCart();
    }

    function renderCart(){
      cartItemsEl.innerHTML = '';
      const keys = Object.keys(cart);
      if (!keys.length){
        cartItemsEl.innerHTML = '<small class="note">Tu carrito está vacío.</small>';
        cartTotalEl.textContent = toCurrency(0);
        return;
      }

      let total = 0;
      keys.forEach(id=>{
        const it = cart[id];
        total += it.price * it.qty;
        const item = document.createElement('div'); item.className='item';
        item.innerHTML = `
          <div>
            <strong>${it.title}</strong><br><small class='note'>${toCurrency(it.price)} x ${it.qty}</small>
          </div>
          <div style='display:flex;gap:8px;align-items:center'>
            <button class='ghost' data-action='minus' data-id='${it.id}'>-</button>
            <button class='ghost' data-action='plus' data-id='${it.id}'>+</button>
          </div>
        `;
        cartItemsEl.appendChild(item);
      });

      cartTotalEl.textContent = toCurrency(total);
    }

    // Delegación en carrito para + y -
    cartItemsEl.addEventListener('click', (e)=>{
      const btn = e.target.closest('button'); if(!btn) return;
      const id = btn.dataset.id; const action = btn.dataset.action;
      if (action==='minus') removeFromCart(id);
      if (action==='plus') addToCart(id);
    });

    document.getElementById('clear-cart').addEventListener('click', clearCart);

    // Checkout: envío por EmailJS
    const checkoutForm = document.getElementById('checkout-form');
    checkoutForm.addEventListener('submit', function(e){
      e.preventDefault();

      const formData = new FormData(this);
      const name = formData.get('customer_name');
      const email = formData.get('customer_email');
      const notes = formData.get('notes') || '';

      // Validar carrito
      const items = Object.values(cart);
      if (!items.length) return alert('El carrito está vacío.');

      // Preparar detalle de la orden
      const lines = items.map(it => `${it.title} — ${it.qty} x S/ ${it.price.toFixed(2)} = S/ ${(it.price*it.qty).toFixed(2)}`);
      const subtotal = items.reduce((s,it)=>s+it.price*it.qty,0);
      const total = subtotal; // aquí podrías añadir impuestos/envío

      const orderDetails = lines.join('\n');

      // Datos que pedirá tu plantilla en EmailJS
      const templateParams = {
        customer_name: name,
        customer_email: email,
        notes: notes,
        order_details: orderDetails,
        total: 'S/ ' + total.toFixed(2),
        // también puedes añadir un campo con todos los items en formato JSON si lo prefieres
        raw_order: JSON.stringify(items, null, 2)
      };

      // Enviar por EmailJS
      if (!window.emailjs) return alert('EmailJS no está cargado.');

      emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
        .then((response)=>{
          console.log('SUCCESS!', response.status, response.text);
          alert('Pedido enviado. Revisa tu correo.');
          clearCart();
          checkoutForm.reset();
        }, (err)=>{
          console.error('FAILED...', err);
          alert('No se pudo enviar el pedido: ' + (err.text || JSON.stringify(err)));
        });

    });

    // Inicializar render
    renderCart();

  </script>
</body>
</html>
